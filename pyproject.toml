[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-cookiesregtech"
version = "1.0.0"
description = "CookiesRegTech cookie consent for Wagtail: guided connect in the Wagtail admin, automatic banner injection, cookie scanner, and consent log."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SKYNET TECHNOLOGIES USA LLC" }]
requires-python = ">=3.9"
dependencies = ["Django>=4.2", "wagtail>=4.1"]

[project.urls]
Homepage = "https://www.cookiesregtech.com"

[tool.setuptools.packages.find]
include = ["wagtail_cookiesregtech*"]

[tool.setuptools.package-data]
wagtail_cookiesregtech = ["templates/**/*", "static/**/*"]
